<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TED · Quick</title>
<style>
:root{--bg:#050910;--line:#1a2b40;--cyan:#38d6f5;--cyan2:#0f8fb0;--txt:#d8e6f3;--mut:#7d93ab;--red:#ff5d6c;--green:#47d18c;--amp:0}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:radial-gradient(ellipse at 50% -20%,#0f3550,var(--bg) 60%);color:var(--txt);font:15px/1.5 "Segoe UI",system-ui,sans-serif;
  display:flex;flex-direction:column;padding:18px;gap:14px;overflow:hidden}
.top{display:flex;align-items:center;gap:14px}
.core{width:62px;height:62px;flex:none;position:relative}
.core svg{width:100%;height:100%;overflow:visible}
.ring{fill:none;stroke:var(--cyan);transform-origin:50px 50px}
.r1{stroke-width:1.5;stroke-dasharray:2 5;opacity:.6;animation:spin 20s linear infinite}
.r2{stroke-width:4;stroke-dasharray:30 10;animation:spin 6s linear infinite reverse}
.r3{stroke-width:1.5;stroke-dasharray:60 160;animation:spin 2.4s cubic-bezier(.6,.1,.4,.9) infinite}
body.listen .r2{animation-duration:1.2s;stroke:var(--red)} body.busy .r2{animation-duration:1.4s}
.dot{transform-origin:50px 50px;transform:scale(calc(1 + var(--amp)*.8));transition:transform .06s}
.glow{filter:drop-shadow(0 0 calc(6px + var(--amp)*24px) var(--cyan))}
@keyframes spin{to{transform:rotate(360deg)}}
.brand{font-size:11px;letter-spacing:5px;color:var(--cyan)}
.state{font-size:13px;color:var(--mut)}
.row{display:flex;gap:8px}
input{flex:1;background:#04080e;border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:12px 14px;font:inherit;font-size:15.5px}
input:focus{outline:0;border-color:var(--cyan2);box-shadow:0 0 0 3px rgba(56,214,245,.12),0 0 24px rgba(56,214,245,.12)}
button{background:rgba(18,37,58,.9);border:1px solid var(--line);color:var(--txt);padding:8px 14px;border-radius:10px;cursor:pointer;font:inherit;font-size:14px}
button:hover{border-color:var(--cyan2)} button.pri{background:var(--cyan2);border-color:var(--cyan2);color:#fff}
#mic{font-size:20px;width:52px} #mic.rec{background:var(--red);border-color:var(--red);animation:pulse .8s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(255,93,108,.15)}}
#out{flex:1;overflow:auto}
.ans{padding:12px 14px;border-left:2px solid var(--cyan);background:rgba(56,214,245,.06);border-radius:0 12px 12px 0;animation:in .35s both;white-space:pre-wrap}
.heard{font-size:13px;color:var(--mut);margin-bottom:8px;animation:in .3s both}
.prop{border:1px solid var(--cyan2);border-radius:12px;padding:12px 14px;background:rgba(15,143,176,.08);animation:in .35s both}
.prop label{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}
.prop input,.prop select{width:100%;background:#04080e;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:7px 10px;font:inherit;font-size:14px}
.acts{display:flex;gap:6px;margin-top:12px}
.src{font-size:13px;padding:5px 0;border-bottom:1px solid var(--line)} .src a{color:var(--cyan);cursor:pointer}
.hint{font-size:12.5px;color:var(--mut);line-height:1.8}
.hint b{color:var(--txt);font-weight:500}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
</style>
</head>
<body>
<div class="top">
  <div class="core"><svg viewBox="0 0 100 100"><g class="glow">
    <circle class="ring r1" cx="50" cy="50" r="47"/><circle class="ring r2" cx="50" cy="50" r="36"/><circle class="ring r3" cx="50" cy="50" r="27"/>
    <g class="dot"><circle cx="50" cy="50" r="15" fill="#7fe8ff" opacity=".55"/><circle cx="50" cy="50" r="7" fill="#effdff"/></g></g></svg></div>
  <div><div class="brand">TED</div><div class="state" id="state">What can I do for you?</div></div>
</div>
<div class="row"><input id="q" placeholder="A command or a question (English or Mongolian)…" autocomplete="off" autofocus><button id="mic" title="Speak">🎙</button><button class="pri" id="go">➤</button></div>
<div id="out"><div class="hint">
  Examples:<br><b>“Mark [teacher] as sick today”</b><br><b>“Check my mail”</b><br>
  <b>“Schedule a meeting tomorrow at 3 pm”</b><br><b>“What meetings do I have tomorrow?”</b><br><br>Esc — close · press 🎙 and speak; it sends when you stop</div></div>
<audio id="audio"></audio>
<script>
const $ = id => document.getElementById(id);
const esc = s => (s ?? "").toString().replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let COMMANDS = [], HAS_AI = true;
fetch("/api/state").then(r => r.json()).then(s => { COMMANDS = s.macros || []; HAS_AI = s.voice_ok; window.LISTS = s.sm_lists || {}; });
const setState = t => $("state").textContent = t;
function typeInto(el, t){ let i = 0; t = t || ""; (function st(){ el.textContent = t.slice(0, i += 3); if(i < t.length) setTimeout(st, 12); })(); }
function speak(t){ if(!t) return; const a = $("audio"); a.src = "/api/tts?text=" + encodeURIComponent(t.slice(0, 500)); a.play().catch(()=>{}); }

function show(plan, heard, voice){
  const out = $("out"); out.innerHTML = heard ? `<div class="heard">🎙 «${esc(heard)}»</div>` : "";
  if(plan.type === "macro"){
    const m = COMMANDS.find(c => c.name === plan.macro); if(!m){ out.insertAdjacentHTML("beforeend", `<div class="ans">Command not found.</div>`); return; }
    const p = plan.params || {};
    out.insertAdjacentHTML("beforeend", `<div class="prop"><b>${esc(m.title || m.name)}</b><div class="state">${esc(plan.say || "")}</div>
      ${(m.params||[]).map(x => `<label>${esc(x.label)}${x.optional ? " (optional)" : ""}</label>` + (x.choices
        ? `<select data-p="${esc(x.name)}"><option value="">—</option>${x.choices.map(c => `<option value="${esc(c)}" ${c === p[x.name] ? "selected" : ""}>${esc((x.choice_labels||{})[c] && x.choice_labels[c] !== c ? x.choice_labels[c] + " · " + c : c)}</option>`).join("")}</select>`
        : `<input data-p="${esc(x.name)}" value="${esc(p[x.name] || "")}" ${x.suggest ? `list="dl${esc(x.name)}"` : ""}>${x.suggest && LISTS[x.suggest] ? `<datalist id="dl${esc(x.name)}">${LISTS[x.suggest].map(v => `<option value="${esc(v)}">`).join("")}</datalist>` : ""}`)).join("")}
      <div class="acts"><button class="pri" id="run">▶ Run</button><button id="no">Cancel</button></div></div>`);
    $("no").onclick = () => out.innerHTML = "";
    $("run").onclick = async () => {
      const params = {}; out.querySelectorAll("[data-p]").forEach(e => params[e.dataset.p] = e.value.trim());
      const miss = (m.params||[]).find(x => !x.optional && !params[x.name]); if(miss){ setState(`“${miss.label}” is empty`); return; }
      document.body.classList.add("busy"); setState("Running…");
      const r = await (await fetch("/api/macros/run", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({name: m.name, params})})).json();
      document.body.classList.remove("busy");
      out.innerHTML = `<div class="ans">${r.ok ? "✓" : "✗"} ${esc(m.title || m.name)}\n${esc((r.log||[]).join("\n"))}</div>`;
      setState(r.ok ? "Done" : "Something went wrong"); if(voice) speak(r.ok ? "Done." : "Sorry, something went wrong.");
    };
    if(voice) speak(plan.say);
    return;
  }
  out.insertAdjacentHTML("beforeend", `<div class="ans"></div>`); typeInto(out.lastChild, plan.say);
  if(plan.sources) out.insertAdjacentHTML("beforeend", plan.sources.slice(0,5).map(s => `<div class="src">📄 <a data-open="${esc(s.path)}">${esc(s.name)}</a> <span class="state">${esc(s.folder)}</span></div>`).join(""));
  if(voice) speak(plan.say);
}
$("out").addEventListener("click", e => { const a = e.target.closest("[data-open]"); if(a) fetch("/api/open", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({path: a.dataset.open})}); });

async function send(){
  const text = $("q").value.trim(); if(!text) return;
  document.body.classList.add("busy"); setState("Thinking…");
  try{ const r = await fetch("/api/command", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({text})});
    const d = await r.json(); if(!r.ok) throw new Error(d.detail); show(d); setState("What can I do for you?"); $("q").value = ""; }
  catch(e){ setState("Error: " + e.message); } finally{ document.body.classList.remove("busy"); }
}
$("go").onclick = send;
$("q").addEventListener("keydown", e => { if(e.key === "Enter") send(); });
document.addEventListener("keydown", e => { if(e.key === "Escape") window.close(); });

/* ---- Voice ---- */
let rec = null;
async function startRec(onStop){
  const stream = await navigator.mediaDevices.getUserMedia({audio: {echoCancellation: true, noiseSuppression: true}});
  const ctx = new AudioContext(), src = ctx.createMediaStreamSource(stream), proc = ctx.createScriptProcessor(4096, 1, 1), chunks = [];
  let spoke = false, silent = 0, stopped = false; const t0 = performance.now();
  proc.onaudioprocess = e => { const d = e.inputBuffer.getChannelData(0); chunks.push(new Float32Array(d));
    let s = 0; for(let i = 0; i < d.length; i += 8) s += d[i]*d[i]; const rms = Math.sqrt(s/(d.length/8));
    document.body.style.setProperty("--amp", Math.min(1, rms*6).toFixed(3)); const now = performance.now();
    if(rms > 0.02){ spoke = true; silent = 0; } else if(spoke && !silent) silent = now;
    if((spoke && silent && now - silent > 1500) || now - t0 > 15000) stop(); };
  src.connect(proc); proc.connect(ctx.destination);
  async function stop(){ if(stopped) return; stopped = true; proc.disconnect(); src.disconnect(); stream.getTracks().forEach(t => t.stop());
    const len = chunks.reduce((a, c) => a + c.length, 0), all = new Float32Array(len); let o = 0; for(const c of chunks){ all.set(c, o); o += c.length; }
    const ratio = ctx.sampleRate/16000, n = Math.floor(len/ratio), pcm = new Int16Array(n);
    for(let i = 0; i < n; i++){ const v = Math.max(-1, Math.min(1, all[Math.floor(i*ratio)])); pcm[i] = v < 0 ? v*0x8000 : v*0x7FFF; }
    const buf = new ArrayBuffer(44 + n*2), dv = new DataView(buf), w = (p, s) => [...s].forEach((ch, i) => dv.setUint8(p+i, ch.charCodeAt(0)));
    w(0,"RIFF"); dv.setUint32(4,36+n*2,true); w(8,"WAVE"); w(12,"fmt "); dv.setUint32(16,16,true); dv.setUint16(20,1,true); dv.setUint16(22,1,true);
    dv.setUint32(24,16000,true); dv.setUint32(28,32000,true); dv.setUint16(32,2,true); dv.setUint16(34,16,true); w(36,"data"); dv.setUint32(40,n*2,true);
    new Int16Array(buf, 44).set(pcm); await ctx.close(); onStop(new Blob([buf], {type: "audio/wav"})); }
  return {stop};
}
async function toggleVoice(){
  if(rec){ rec.stop(); return; }
  if(!HAS_AI){ setState("Voice needs a Gemini key or offline English (vosk)"); return; }
  try{
    document.body.classList.add("listen"); $("mic").classList.add("rec"); setState("Listening… go ahead");
    rec = await startRec(async wav => {
      rec = null; document.body.classList.remove("listen"); $("mic").classList.remove("rec"); document.body.classList.add("busy"); setState("Thinking…");
      try{ const r = await fetch("/api/voice", {method: "POST", headers: {"Content-Type": "audio/wav"}, body: wav}); const d = await r.json();
        if(!r.ok) throw new Error(d.detail); show(d.plan, d.text, true); setState("What can I do for you?"); }
      catch(e){ setState("Error: " + e.message); } finally{ document.body.classList.remove("busy"); }
    });
  }catch(e){ document.body.classList.remove("listen"); $("mic").classList.remove("rec"); rec = null; setState("Could not open the microphone: " + e.message); }
}
$("mic").onclick = toggleVoice;
if(new URLSearchParams(location.search).get("voice") === "1") setTimeout(toggleVoice, 400);
</script>
</body>
</html>
